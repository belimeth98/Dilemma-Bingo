<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 현황 · 7x7 딜레마 빙고</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { color-scheme: dark; font-family: 'Pretendard', sans-serif; background: #0f172a; color: #f8fafc; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { font: inherit; cursor: pointer; }
        button:disabled { opacity: .35; cursor: not-allowed; }
        button:focus-visible, a:focus-visible { outline: 3px solid #60a5fa; outline-offset: 4px; }
        a { color: inherit; text-decoration: none; }
        .shell { max-width: 1600px; margin: auto; padding: 26px 32px 18px; }
        .topbar, .toolbar, .card-heading, .log-heading, .footer, .pager, .view-controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .topbar { padding-bottom: 22px; border-bottom: 1px solid #334155; }
        .brand { color: #94a3b8; font-size: 13px; font-weight: 700; letter-spacing: .06em; }
        h1 { margin: 8px 0 7px; font-size: 30px; letter-spacing: -.04em; }
        .gradient { background: linear-gradient(90deg, #60a5fa, #34d399); color: transparent; background-clip: text; }
        .subtitle { margin: 0; color: #94a3b8; font-size: 14px; line-height: 1.6; }
        .home { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #475569; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; white-space: nowrap; }
        .home:hover { background: #1e293b; }
        .toolbar { padding: 20px 0; flex-wrap: wrap; }
        .summary { display: flex; align-items: center; gap: 12px; font-size: 15px; flex-wrap: wrap; }
        .summary strong { color: #60a5fa; }
        .connection { display: inline-flex; align-items: center; gap: 7px; color: #94a3b8; font-size: 12px; }
        .connection::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
        .connection[data-state="live"] { color: #6ee7b7; }
        .connection[data-state="live"]::before { background: #34d399; box-shadow: 0 0 8px #34d39966; }
        .connection[data-state="error"] { color: #fbbf24; }
        .connection[data-state="error"]::before { background: #fbbf24; }
        .view-controls { gap: 12px; color: #94a3b8; font-size: 13px; }
        .segmented { display: flex; background: #1e293b; border: 1px solid #334155; border-radius: 9px; padding: 3px; gap: 3px; }
        .segmented button { border: 0; border-radius: 6px; color: #94a3b8; background: transparent; padding: 7px 13px; font-weight: 700; }
        .segmented button[aria-pressed="true"] { background: #2563eb; color: white; box-shadow: 0 2px 5px #0003; }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); height: max(680px, calc(100dvh - 252px)); }
        .grid[data-count="1"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: max(400px, calc(100dvh - 280px)); }
        .grid[data-count="2"] { grid-template-rows: minmax(0, 1fr); height: max(400px, calc(100dvh - 280px)); }
        .game-card { min-width: 0; min-height: 0; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; box-shadow: 0 8px 24px #02061722; transition: border-color .25s, box-shadow .25s; }
        .game-card.trading { border: 2px solid #a855f7; padding: 17px 19px; box-shadow: 0 0 20px #a855f733; }
        .game-card.finished { border-color: #34d39988; }
        .finished .badge { background: #064e3b; color: #a7f3d0; }
        .card-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .close-result { width: 30px; height: 30px; border-radius: 7px; border: 1px solid #475569; background: #334155; color: #e2e8f0; font-size: 23px; line-height: 1; }
        .close-result:hover { border-color: #fb7185; background: #881337; }
        .winner-result { max-height: 150px; overflow: auto; background: #064e3b55; border: 1px solid #10b98155; padding: 15px; flex-direction: column; gap: 6px; }
        .winner-result .turn-label { color: #a7f3d0; }
        .winner-result .turn-name { color: #fcd34d; font-size: 20px; }
        .result-note { color: #94a3b8; font-size: 11px; line-height: 1.6; margin: 10px 0 16px; }
        .game-card.trade-alert { animation: trade-glow 1.2s ease-in-out 3; }
        @keyframes trade-glow { 50% { box-shadow: 0 0 32px #a855f780; border-color: #d8b4fe; } }
        .card-heading { gap: 8px; align-items: flex-start; margin-bottom: 11px; }
        .card-heading h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
        .card-meta { color: #94a3b8; font-size: 11px; margin: 5px 0 0; }
        .badge { font-size: 11px; font-weight: 700; background: #064e3b55; color: #6ee7b7; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
        .trading .badge { background: #581c8755; color: #d8b4fe; }
        .paused .badge { background: #334155; color: #cbd5e1; }
        .card-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .game-summary { flex-shrink: 0; }
        .turn { font-size: 14px; background: #0f172a; border-radius: 8px; padding: 9px 11px; display: flex; align-items: baseline; gap: 9px; }
        .turn-label { color: #94a3b8; font-size: 12px; flex-shrink: 0; }
        .turn-name { color: #fbbf24; font-weight: 800; overflow-wrap: anywhere; }
        .trading .turn-name { color: #d8b4fe; }
        .players { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 9px 0; }
        .player { font-size: 11px; color: #cbd5e1; border: 1px solid #475569; border-radius: 6px; padding: 4px 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .player.current { border-color: #f59e0b88; color: #fcd34d; }
        .danger { background: #4c051955; border: 1px solid #be123c88; color: #fda4af; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.6; margin-bottom: 9px; max-height: 78px; overflow: auto; overflow-wrap: anywhere; }
        .danger strong { color: #fbbf24; }
        .danger-number { display: inline-block; background: #be123c; color: white; padding: 0 5px; margin: 0 2px; border-radius: 4px; font-weight: 800; }
        .logs { min-height: 0; flex: 1; display: flex; flex-direction: column; border-top: 1px solid #334155; padding-top: 9px; }
        .log-heading { gap: 6px; font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
        .log-heading h3 { margin: 0; color: #cbd5e1; font-size: 12px; }
        .log-nav { display: flex; align-items: center; gap: 6px; }
        .log-nav button { border: 1px solid #475569; background: #334155; color: #e2e8f0; border-radius: 5px; width: 24px; height: 24px; }
        .log-list { list-style: none; margin: 0; padding: 0; overflow: auto; min-height: 40px; }
        .log-list li { display: flex; gap: 9px; align-items: baseline; font-size: 12px; line-height: 1.6; padding: 4px 0; border-bottom: 1px solid #33415566; overflow-wrap: anywhere; }
        .log-list time { color: #64748b; font-size: 10px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
        .log-empty { color: #64748b; font-size: 12px; margin: 10px 0; }
        .placeholder { border: 1px dashed #334155; background: #0f172a; box-shadow: none; align-items: center; justify-content: center; color: #475569; font-size: 13px; gap: 12px; }
        .placeholder span { font-size: 26px; opacity: .5; }
        .empty-state { min-height: 440px; border: 1px dashed #334155; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .empty-state .icon { color: #60a5fa; background: #172554; padding: 20px; border-radius: 20px; font-size: 32px; }
        .empty-state h2 { font-size: 21px; margin: 22px 0 8px; }
        .empty-state p { color: #94a3b8; font-size: 14px; line-height: 1.7; margin: 0 0 22px; }
        .footer { padding-top: 16px; color: #64748b; font-size: 11px; flex-wrap: wrap; }
        .pager { gap: 14px; color: #cbd5e1; font-size: 13px; }
        .pager button { background: #1e293b; border: 1px solid #475569; color: #e2e8f0; padding: 8px 12px; border-radius: 7px; }
        .notice { border: 1px solid #92400e; background: #451a0333; color: #fcd34d; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
        [hidden] { display: none !important; }
        @media (min-width: 1000px) {
            .grid[data-count="1"] .game-card { padding: 30px; }
            .grid[data-count="1"] .card-heading h2 { font-size: 25px; }
            .grid[data-count="1"] .card-content { flex-direction: row; gap: 32px; padding-top: 20px; }
            .grid[data-count="1"] .game-summary { width: 36%; }
            .grid[data-count="1"] .logs { border-top: 0; border-left: 1px solid #334155; padding: 0 0 0 32px; }
            .grid[data-count="1"] .turn { padding: 20px; font-size: 23px; flex-direction: column; gap: 8px; }
            .grid[data-count="1"] .players { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 20px 0; }
            .grid[data-count="1"] .player { padding: 9px 12px; font-size: 14px; }
            .grid[data-count="1"] .danger { font-size: 15px; padding: 16px; max-height: 220px; }
            .grid[data-count="1"] .log-list li { padding: 18px 0; font-size: 16px; }
            .grid[data-count="1"] .log-list time { font-size: 12px; }
            .grid[data-count="1"] .log-heading h3 { font-size: 16px; }
        }
        @media (max-width: 700px) {
            .shell { padding: 18px 14px; }
            .topbar { gap: 8px; align-items: flex-start; }
            h1 { font-size: 25px; }
            .subtitle { font-size: 12px; max-width: 225px; }
            .home { padding: 9px 10px; font-size: 12px; }
            .toolbar { gap: 14px; }
            .view-controls { width: 100%; justify-content: space-between; }
            .grid { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: minmax(350px, auto); }
            .grid[data-count="1"], .grid[data-count="2"] { grid-template-rows: none; height: auto; }
            .grid[data-count="1"] { min-height: 60dvh; }
            .players { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .game-card { padding: 16px; }
            .game-card.trading { padding: 15px; }
            .log-list { max-height: 240px; }
            .footer { justify-content: center; text-align: center; gap: 16px; }
            .footer p { width: 100%; margin-bottom: 0; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
    <script src="/game-status.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <a class="brand" href="/">⚔️ 7x7 딜레마 빙고</a>
                <h1 class="gradient">게임 현황</h1>
                <p class="subtitle">지금 진행 중인 심리전, 한눈에 지켜보세요.</p>
            </div>
            <a class="home" href="/">← 메인으로</a>
        </header>
        <section class="toolbar" aria-label="관전 화면 설정">
            <div class="summary"><span>진행 중 <strong id="game-total">—</strong>개</span><span id="finished-summary" hidden>종료 <strong id="finished-total">0</strong>개 · 결과 확인 대기</span><span id="connection" class="connection" role="status">연결 중</span></div>
            <div class="view-controls"><span>최신 게임순</span><div class="segmented" role="group" aria-label="동시에 볼 게임 수">
                <button type="button" data-count="1" aria-pressed="false">1개</button>
                <button type="button" data-count="2" aria-pressed="false">2개</button>
                <button type="button" data-count="4" aria-pressed="true">4개</button>
            </div></div>
        </section>
        <div id="notice" class="notice" role="status" hidden></div>
        <section id="game-grid" class="grid" data-count="4" aria-label="게임 현황 목록" hidden></section>
        <section id="empty-state" class="empty-state" aria-live="polite">
            <span class="icon" aria-hidden="true">◉</span><h2 id="empty-title">게임 현황에 연결하고 있어요</h2>
            <p id="empty-description">진행 중인 게임을 잠시 후 보여드릴게요.</p>
            <a class="home" href="/">메인에서 게임 시작하기 →</a>
        </section>
        <footer class="footer">
            <p>🔒 빙고판은 비공개 · 공개 로그만 표시 · 로그는 서버 시작 이후 최근 200개</p>
            <nav class="pager" aria-label="게임 페이지">
                <button type="button" id="previous-page" disabled>← 이전</button><span id="page-label">1 / 1</span><button type="button" id="next-page" disabled>다음 →</button>
            </nav>
        </footer>
        <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
        <noscript>게임 현황을 보려면 JavaScript를 활성화해주세요.</noscript>
    </main>
</body>
</html>
